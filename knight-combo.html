<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:#e8e9ed;overflow:hidden}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe8e9ed);
const camera=new THREE.PerspectiveCamera(30,1,0.01,100); camera.position.set(3.7,2.8,6.7);camera.lookAt(0,1.05,0);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(512,512);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x7a7795,2.3));const light=new THREE.DirectionalLight(0xffffff,2.3);light.position.set(3,7,5);scene.add(light);
const ground=new THREE.Mesh(new THREE.CircleGeometry(1.3,40),new THREE.MeshBasicMaterial({color:0xd6d8df}));ground.rotation.x=-Math.PI/2;ground.position.y=-0.015;scene.add(ground);
const load=(url)=>new Promise((ok,fail)=>new GLTFLoader().load(url,ok,undefined,fail));
const [knight,animations]=await Promise.all([load('/assets/models/characters/Knight_SD_v1.glb'),load('/assets/models/anims-adventurer.glb')]);
scene.add(knight.scene);
// GLTFLoader tracks are targeted by node name; adventurer animations use the exact same rig.
const mixer=new THREE.AnimationMixer(knight.scene);
const clips=['1H_Melee_Attack_Chop','1H_Melee_Attack_Stab','2H_Melee_Attack_Spin'];
const actions=clips.map(name=>{const clip=THREE.AnimationClip.findByName(animations.animations,name);if(!clip)throw Error('missing '+name);return mixer.clipAction(clip)});
const sword=knight.scene.getObjectByName('1H_Sword');if(sword)sword.visible=true;
for(const name of ['2H_Sword','1H_Sword_Offhand','Badge_Shield','Rectangle_Shield','Round_Shield','Spike_Shield']){const obj=knight.scene.getObjectByName(name);if(obj)obj.visible=false;}
const lengths=actions.map(a=>a.getClip().duration);
window.renderComboFrame=(time)=>{let index=0,t=time;while(index<lengths.length-1&&t>=lengths[index]){t-=lengths[index];index++}actions.forEach((action,i)=>{action.enabled=i===index;action.setEffectiveWeight(i===index?1:0);action.paused=true;action.time=i===index?Math.min(t,lengths[i]-0.0001):0});mixer.update(0);renderer.render(scene,camera)};
window.comboDuration=lengths.reduce((a,b)=>a+b,0);window.comboReady=true;window.renderComboFrame(0);
</script></body></html>
